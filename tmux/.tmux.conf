# Change prefix key to z
set -g prefix C-z
unbind C-b

# Custom keybindings
bind C-z send-prefix
bind Z last-window
bind z resize-pane -Z
bind R source-file ~/.tmux.conf
bind e set -g synchronize-panes

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# keybindings to make resizing easier
bind -r C-h resize-pane -L
bind -r C-j resize-pane -D
bind -r C-k resize-pane -U
bind -r C-l resize-pane -R

bind / choose-window 'swap-window -t %%'

# Emacs keys
set -gw mode-keys emacs

set -g mouse on
# Pass scroll events to applications with mouse mode enabled, otherwise use copy-mode
bind -n WheelUpPane if-shell -F "#{mouse_any_flag}" "send-keys -M" "copy-mode -e; send-keys -M"
bind -n WheelDownPane if-shell -F "#{mouse_any_flag}" "send-keys -M" "send-keys -M"

set -g set-clipboard on
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Terminfo
set -g default-terminal "tmux-256color"
set -as terminal-features ',tmux-256color:RGB'

# Bigger history
set -g history-limit 10000

# Window / Status options
set -g base-index 1
set -g set-titles on
# Put user@host in the terminal title (plus session/window/pane and cwd)
set -g set-titles-string '#(whoami)@#H | #{session_name}:#{window_index}.#{pane_index} | #{pane_current_path}'

set -s escape-time 0
set -g renumber-windows on
#set -g default-command "tmux rename-window ''; reattach-to-user-namespace -l $SHELL -l"
setw -g automatic-rename off
setw -g aggressive-resize on

# Visual setup:
set -g status-fg white
set -g status-bg colour234

# Status bar
set -g status-left-length 32
set -g status-right-length 150
set -g status-interval 5

set -g status-left '#[fg=colour16,bg=colour254,bold]#{prefix_highlight}#[fg=colour16,bg=colour254,bold] #S #[fg=colour254,bg=colour238,nobold]#[fg=colour15,bg=colour238,bold]#[fg=colour238,bg=colour234,nobold]'
set -g status-right '#[fg=colour245]❬ %R ❬ %d %b #[fg=colour254,bg=colour234,nobold]#[fg=colour16,bg=colour254,bold] #h '

setw -g window-status-style fg=white,bg=black,dim
set -g window-status-format "#[fg=white,bg=colour234] #I #W "

set -g window-status-current-format "#[fg=colour234,bg=colour39]#[fg=colour16,bg=colour39,noreverse,bold] #I ❭ #W #[fg=colour39,bg=colour234,nobold]"
setw -g window-status-current-style fg=green

# OS Specifics
if-shell 'test "$(uname)" = "Darwin"' 'source ~/.tmux-macos.conf' 'source ~/.tmux-linux.conf'

# https://github.com/nielsgroen/claude-tmux
bind-key C-c display-popup -E -w 80 -h 30 "~/.cargo/bin/claude-tmux"

### Plugins
# See https://github.com/tmux-plugins/tpm
set -g @plugin 'sainnhe/tmux-fzf'  # <prefix>  F

set -g @plugin 'jaclu/tmux-menus'  # <prefix> \

set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin '27medkamal/tmux-session-wizard' # <prefix> T
set -g @session-wizard-mode 'short-path'

set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @prefix_highlight_fg 'colour231'
set -g @prefix_highlight_bg 'colour04'
set -g @prefix_highlight_empty_prompt '    '
set -g @prefix_highlight_empty_attr 'bg=color254'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=black,bg=pink,bold' # default is 'fg=default,bg=yellow'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_sync_mode_attr 'fg=black,bg=orange,bold' # default is 'fg=default,bg=yellow'

# <prefix> + I to install plugins
if-shell '[ -f ~/.tmux/plugins/tpm/tpm ]' {
    run '~/.tmux/plugins/tpm/tpm'
}