# Linux-specific tmux configuration

# Refresh these variables from the attaching client when a session is
# attached, so new panes see the current display / ssh agent.
# (Already-running shells keep their old values; use fix-agent for SSH.)
set-option -g update-environment "DISPLAY \
                                  I3SOCK \
                                  KRB5CCNAME \
                                  SSH_AGENT_PID \
                                  SSH_ASKPASS \
                                  SSH_AUTH_SOCK \
                                  SSH_CONNECTION \
                                  SWAYSOCK \
                                  WAYLAND_DISPLAY \
                                  WINDOWID \
                                  XAUTHORITY"
